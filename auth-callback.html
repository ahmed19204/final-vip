<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Center - جاري تسجيل الدخول</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Tahoma:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .callback-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            padding: 2rem;
        }
        
        .callback-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 77, 77, 0.2);
            border-radius: 20px;
            padding: 3rem 2rem;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        
        .callback-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 2rem auto;
            border: 2px solid #ff4d4d;
            object-fit: cover;
        }
        
        .callback-title {
            color: #fff;
            font-size: 1.8rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #ff4d4d, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .callback-message {
            color: #ccc;
            margin-bottom: 2rem;
            font-size: 1rem;
            line-height: 1.5;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 77, 77, 0.2);
            border-top: 4px solid #ff4d4d;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 2rem auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .callback-status {
            padding: 1rem;
            border-radius: 12px;
            margin: 1rem 0;
            font-weight: 500;
        }
        
        .status-success {
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.3);
            color: #4caf50;
        }
        
        .status-error {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid rgba(244, 67, 54, 0.3);
            color: #f44336;
        }
        
        .callback-btn {
            background: linear-gradient(135deg, #ff4d4d, #ff6b6b);
            border: none;
            border-radius: 12px;
            color: white;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            margin-top: 1rem;
        }
        
        .callback-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 77, 77, 0.3);
        }
        
        @media (max-width: 480px) {
            .callback-card {
                padding: 2rem 1.5rem;
            }
            
            .callback-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="callback-container">
        <div class="callback-card">
            <img src="images/vip-logo.jpg" alt="VIP Center" class="callback-logo">
            
            <div id="loadingState">
                <div class="loading-spinner"></div>
                <h1 class="callback-title">جاري تسجيل الدخول</h1>
                <p class="callback-message">يرجى الانتظار بينما نقوم بإعداد حسابك...</p>
            </div>
            
            <div id="successState" style="display: none;">
                <h1 class="callback-title">مرحباً بك!</h1>
                <div class="callback-status status-success" id="successMessage">
                    تم تسجيل الدخول بنجاح
                </div>
                <p class="callback-message">سيتم توجيهك إلى الصفحة الرئيسية خلال ثوانٍ...</p>
            </div>
            
            <div id="errorState" style="display: none;">
                <h1 class="callback-title">حدث خطأ</h1>
                <div class="callback-status status-error" id="errorMessage">
                    فشل في تسجيل الدخول
                </div>
                <p class="callback-message">يرجى المحاولة مرة أخرى</p>
                <a href="login-simple.html" class="callback-btn">العودة لتسجيل الدخول</a>
            </div>
        </div>
    </div>

    <script src="js/supabase-config.js"></script>
    <script>
        async function handleAuthCallback() {
            try {
                // التحقق من وجود معاملات OAuth في الرابط
                const urlParams = new URLSearchParams(window.location.search);
                const fragment = new URLSearchParams(window.location.hash.substring(1));
                
                // البحث عن access_token في URL أو fragment
                const accessToken = urlParams.get('access_token') || fragment.get('access_token');
                const error = urlParams.get('error') || fragment.get('error');
                const errorDescription = urlParams.get('error_description') || fragment.get('error_description');
                
                if (error) {
                    throw new Error(errorDescription || error);
                }
                
                if (!accessToken) {
                    // محاولة الحصول على المستخدم من Supabase session
                    const { data: { session }, error: sessionError } = await window.supabaseClient.auth.getSession();
                    
                    if (sessionError || !session) {
                        throw new Error('لم يتم العثور على جلسة صالحة');
                    }
                }
                
                // معالجة OAuth callback
                const result = await window.supabaseFunctions.handleOAuthCallback();
                
                if (result.success) {
                    // إظهار حالة النجاح
                    document.getElementById('loadingState').style.display = 'none';
                    document.getElementById('successState').style.display = 'block';
                    document.getElementById('successMessage').textContent = `مرحباً ${result.user.name}! تم تسجيل الدخول بنجاح`;
                    
                    // حفظ بيانات المستخدم
                    localStorage.setItem('currentUser', JSON.stringify(result.user));
                    localStorage.setItem('isLoggedIn', 'true');
                    
                    // تحديد البيئة وإعادة التوجيه
                    const isProduction = window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1';
                    const homeUrl = isProduction ? 'https://vip-center-1.vercel.app/home.html' : 'home.html';
                    
                    console.log('🏠 Redirecting to:', homeUrl);
                    setTimeout(() => {
                        window.location.href = homeUrl;
                    }, 2000);
                    
                } else {
                    throw new Error(result.error || 'فشل في معالجة تسجيل الدخول');
                }
                
            } catch (error) {
                console.error('Auth callback error:', error);
                
                // إظهار حالة الخطأ
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('errorState').style.display = 'block';
                document.getElementById('errorMessage').textContent = error.message || 'حدث خطأ غير متوقع';
            }
        }
        
        // تشغيل معالجة callback عند تحميل الصفحة
        window.addEventListener('load', handleAuthCallback);
        
        // معالجة تغييرات الـ hash (للـ implicit flow)
        window.addEventListener('hashchange', handleAuthCallback);
    </script>
</body>
</html>
