<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Center - دخول الإدارة</title>
    <link rel="stylesheet" href="css/admin-styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Tahoma:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="admin-login-container">
        <div class="admin-login-card">
            <div class="admin-logo">
                <img src="images/vip-logo.jpg" alt="VIP Center">
                <h2>VIP Center</h2>
                <p>لوحة التحكم الإدارية</p>
            </div>
            
            <form id="adminLoginForm" class="admin-login-form">
                <div class="form-group">
                    <label for="adminUsername" class="form-label">اسم المستخدم</label>
                    <input type="text" id="adminUsername" name="adminUsername" class="form-input" placeholder="أدخل اسم المستخدم" required>
                </div>
                
                <div class="form-group">
                    <label for="adminPassword" class="form-label">كلمة المرور</label>
                    <input type="password" id="adminPassword" name="adminPassword" class="form-input" placeholder="أدخل كلمة المرور" required>
                </div>
                
                <button type="submit" class="admin-login-btn">دخول لوحة التحكم</button>
                
                <div id="adminLoginError" class="error-message" style="display: none; color: #ff4d4d; text-align: center; margin-top: 1rem;">
                    بيانات الدخول غير صحيحة
                </div>
            </form>
            
            <div class="admin-info">
                <p><strong>بيانات الدخول:</strong></p>
                <p>اسم المستخدم: <code>admin</code></p>
                <p>كلمة المرور: <code>admin123</code></p>
                <a href="index.html" class="back-to-site">العودة للموقع الرئيسي</a>
            </div>
        </div>
    </div>

    <script>
        // Admin Login Logic
        document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('adminUsername').value;
            const password = document.getElementById('adminPassword').value;
            const errorDiv = document.getElementById('adminLoginError');
            
            // Simple authentication (in production, use proper JWT)
            if (username === 'admin' && password === 'admin123') {
                // Set authentication flag
                sessionStorage.setItem('adminAuthenticated', 'true');
                
                // Show success message
                errorDiv.style.display = 'block';
                errorDiv.style.color = '#4CAF50';
                errorDiv.textContent = 'تم تسجيل الدخول بنجاح! جاري التوجيه...';
                
                // Redirect to dashboard after 1 second
                setTimeout(() => {
                    window.location.href = 'admin-dashboard.html';
                }, 1000);
            } else {
                // Show error message
                errorDiv.style.display = 'block';
                errorDiv.style.color = '#ff4d4d';
                errorDiv.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة';
                
                // Clear password field
                document.getElementById('adminPassword').value = '';
            }
        });
        
        // Check if already authenticated
        if (sessionStorage.getItem('adminAuthenticated')) {
            window.location.href = 'admin-dashboard.html';
        }
    </script>
</body>
</html>
