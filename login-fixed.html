<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Center - تسجيل الدخول</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Tahoma:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .message {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            text-align: center;
            font-weight: bold;
        }
        
        .message-success {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
            border: 1px solid #4caf50;
        }
        
        .message-error {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
            border: 1px solid #f44336;
        }
        
        .message-info {
            background: rgba(33, 150, 243, 0.2);
            color: #2196f3;
            border: 1px solid #2196f3;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">
                    <img src="images/vip-logo.jpg" alt="VIP Center" class="logo-img">
                </a>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="home.html" class="nav-link">الرئيسية</a>
                </li>
                <li class="nav-item">
                    <a href="teachers.html" class="nav-link">المدرسين</a>
                </li>
                <li class="nav-item">
                    <a href="video-access.html" class="nav-link">فتح الفيديو</a>
                </li>
                <li class="nav-item">
                    <a href="login.html" class="nav-link">تسجيل الدخول</a>
                </li>
                <li class="nav-item">
                    <a href="register.html" class="nav-link register-btn">سجل الآن</a>
                </li>
            </ul>
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="form-container">
        <div id="messageContainer"></div>
        <div class="form-card">
            <div class="form-logo">
                <img src="images/vip-logo.jpg" alt="VIP Center">
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email" class="form-label">البريد الإلكتروني</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="البريد الإلكتروني" required>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">كلمة المرور</label>
                    <div class="password-input-container">
                        <input type="password" id="password" name="password" class="form-input" placeholder="كلمة المرور" required>
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('password')">👁️</button>
                    </div>
                </div>
                

                
                <div class="checkbox-group">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">تذكرني</label>
                </div>
                
                <button type="submit" class="form-submit">تسجيل الدخول</button>
                
                <div class="form-links">
                    <a href="#" id="forgotPassword">نسيت كلمة المرور؟</a>
                    <a href="register.html">ليس لديك حساب؟ سجل حساب جديد.</a>
                </div>
            </form>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // Supabase Configuration
        const SUPABASE_URL = 'https://jiwxilwzqmnwtusysdok.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imppd3hpbHd6cW1ud3R1c3lzZG9rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU0Njk3NTUsImV4cCI6MjA3MTA0NTc1NX0.lvOW9haq2OsSu3tX38QQlvx5bavx-K_Qsv4zl_I6vdU';

        // Create Supabase client
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // إظهار/إخفاء كلمة المرور
        function togglePasswordVisibility(fieldId) {
            const field = document.getElementById(fieldId);
            const button = event.target;
            
            if (field.type === 'password') {
                field.type = 'text';
                button.textContent = '🙈';
            } else {
                field.type = 'password';
                button.textContent = '👁️';
            }
        }

        // تسجيل الدخول
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            
            // التحقق من البيانات
            if (!email || !password) {
                showMessage('يرجى ملء جميع الحقول', 'error');
                return;
            }
            
            if (password.length < 6) {
                showMessage('كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'error');
                return;
            }
            
            try {
                showMessage('جاري تسجيل الدخول...', 'info');
                
                // البحث عن الطالب في قاعدة البيانات
                const { data: students, error } = await supabaseClient
                    .from('students')
                    .select('*')
                    .eq('email', email)
                    .eq('password', password)
                    .single();
                
                if (error || !students) {
                    showMessage('البريد الإلكتروني أو كلمة المرور غير صحيحة', 'error');
                    return;
                }
                
                // تسجيل الدخول ناجح
                showMessage('تم تسجيل الدخول بنجاح!', 'success');
                
                // حفظ بيانات المستخدم
                if (remember) {
                    localStorage.setItem('user', JSON.stringify(students));
                } else {
                    sessionStorage.setItem('user', JSON.stringify(students));
                }
                
                // الانتقال إلى صفحة الملف الشخصي
                setTimeout(() => {
                    window.location.href = 'student-profile.html';
                }, 1500);
                
            } catch (error) {
                console.error('خطأ في تسجيل الدخول:', error);
                showMessage('حدث خطأ أثناء تسجيل الدخول', 'error');
            }
        });

        // إظهار الرسائل
        function showMessage(message, type = 'info') {
            // إزالة الرسائل السابقة
            const existingMessage = document.querySelector('.message');
            if (existingMessage) {
                existingMessage.remove();
            }
            
            // إنشاء رسالة جديدة
            const messageDiv = document.createElement('div');
            messageDiv.className = `message message-${type}`;
            messageDiv.textContent = message;
            
            // إضافة الرسالة للصفحة
            const form = document.getElementById('loginForm');
            form.parentNode.insertBefore(messageDiv, form);
            
            // إزالة الرسالة تلقائياً بعد 5 ثواني
            setTimeout(() => {
                if (messageDiv.parentNode) {
                    messageDiv.remove();
                }
            }, 5000);
        }

        // التحقق من وجود مستخدم مسجل دخول
        document.addEventListener('DOMContentLoaded', function() {
            const user = localStorage.getItem('user') || sessionStorage.getItem('user');
            if (user) {
                // المستخدم مسجل دخول بالفعل
                window.location.href = 'student-profile.html';
            }
        });
    </script>
</body>
</html>
