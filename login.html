<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Center - تسجيل الدخول</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Tahoma:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">
                    <img src="images/vip-logo.jpg" alt="VIP Center" class="logo-img">
                </a>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="home.html" class="nav-link">الرئيسية</a>
                </li>
                <li class="nav-item">
                    <a href="teachers.html" class="nav-link">المدرسين</a>
                </li>
                <li class="nav-item">
                    <a href="video-access.html" class="nav-link">فتح الفيديو</a>
                </li>
                <li class="nav-item">
                    <a href="login.html" class="nav-link">تسجيل الدخول</a>
                </li>
                <li class="nav-item">
                    <a href="register.html" class="nav-link register-btn">سجل الآن</a>
                </li>
            </ul>
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="form-container">
        <div class="form-card">
            <div class="form-logo">
                <img src="images/vip-logo.jpg" alt="VIP Center">
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email" class="form-label">البريد الإلكتروني</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="البريد الإلكتروني" required>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">كلمة المرور</label>
                    <div class="password-input-container">
                        <input type="password" id="password" name="password" class="form-input" placeholder="كلمة المرور" required>
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('password')">👁️</button>
                    </div>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">تذكرني</label>
                </div>
                
                <!-- Loading indicator -->
                <div id="loginLoading" style="display: none; text-align: center; color: #ff4d4d; margin: 1rem 0;">
                    <div style="font-size: 1.5rem;">🔄</div>
                    <p>جاري تسجيل الدخول...</p>
                </div>
                
                <!-- Error message -->
                <div id="loginError" style="display: none; background: #ffebee; color: #c62828; padding: 1rem; border-radius: 8px; margin: 1rem 0; text-align: center; border-right: 4px solid #c62828;"></div>
                
                <button type="submit" class="form-submit" id="loginButton">تسجيل الدخول</button>
                
                <div class="form-links">
                    <a href="#" id="forgotPassword">نسيت كلمة المرور؟</a>
                    <a href="register.html">ليس لديك حساب؟ سجل حساب جديد.</a>
                </div>
            </form>
        </div>
    </main>

    <script src="js/script.js"></script>
    <script src="js/supabase-config.js"></script>
    <script>
        // Real login system
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            
            const loginButton = document.getElementById('loginButton');
            const loginLoading = document.getElementById('loginLoading');
            const loginError = document.getElementById('loginError');
            
            // Show loading
            loginButton.disabled = true;
            loginLoading.style.display = 'block';
            loginError.style.display = 'none';
            
            try {
                // Check if Supabase functions are available
                if (!window.supabaseFunctions) {
                    throw new Error('خدمة قاعدة البيانات غير متاحة');
                }
                
                // Try to login with Supabase Auth
                const { data, error } = await window.supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                
                if (error) {
                    // If Supabase auth fails, try custom login
                    const loginResult = await attemptCustomLogin(email, password);
                    if (!loginResult.success) {
                        throw new Error(loginResult.error);
                    }
                    handleLoginSuccess(loginResult.user, remember);
                } else {
                    // Supabase auth success
                    const user = data.user;
                    
                    // Get additional user data from students table
                    const { data: studentData, error: studentError } = await window.supabaseClient
                        .from('students')
                        .select('*')
                        .eq('email', email)
                        .single();
                    
                    const userData = studentData || {
                        id: user.id,
                        email: user.email,
                        name: user.user_metadata?.full_name || 'مستخدم',
                        phone: user.user_metadata?.phone || '',
                        created_at: user.created_at
                    };
                    
                    handleLoginSuccess(userData, remember);
                }
                
            } catch (error) {
                console.error('Login error:', error);
                loginError.textContent = error.message || 'حدث خطأ في تسجيل الدخول';
                loginError.style.display = 'block';
            } finally {
                loginButton.disabled = false;
                loginLoading.style.display = 'none';
            }
        });
        
        // Custom login for existing data
        async function attemptCustomLogin(email, password) {
            try {
                // Check if user exists in students table
                const { data: students, error } = await window.supabaseClient
                    .from('students')
                    .select('*')
                    .eq('email', email);
                
                if (error) throw error;
                
                if (students && students.length > 0) {
                    const student = students[0];
                    
                    // Simple password check (in production, use proper hashing)
                    if (student.password === password || !student.password) {
                        return { success: true, user: student };
                    }
                }
                
                return { success: false, error: 'البريد الإلكتروني أو كلمة المرور غير صحيحة' };
            } catch (error) {
                return { success: false, error: error.message };
            }
        }
        
        // Handle successful login
        function handleLoginSuccess(user, remember) {
            // Store user data
            const storage = remember ? localStorage : sessionStorage;
            storage.setItem('currentUser', JSON.stringify(user));
            storage.setItem('isLoggedIn', 'true');
            
            // Show success message
            const loginError = document.getElementById('loginError');
            loginError.style.background = '#e8f5e8';
            loginError.style.color = '#2e7d32';
            loginError.style.borderRightColor = '#2e7d32';
            loginError.textContent = `مرحباً ${user.name || user.full_name || 'بك'}! جاري التوجيه...`;
            loginError.style.display = 'block';
            
            // Redirect to student dashboard
            setTimeout(() => {
                window.location.href = 'student-profile.html';
            }, 1500);
        }
        
        // Check if already logged in
        window.addEventListener('load', function() {
            const isLoggedIn = localStorage.getItem('isLoggedIn') || sessionStorage.getItem('isLoggedIn');
            if (isLoggedIn === 'true') {
                window.location.href = 'student-profile.html';
            }
        });
        
        // إظهار/إخفاء كلمة المرور
        function togglePasswordVisibility(fieldId) {
            const field = document.getElementById(fieldId);
            if (field.type === 'password') {
                field.type = 'text';
            } else {
                field.type = 'password';
            }
        }
    </script>
</body>
</html>
