<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Center - إنشاء حساب جديد</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Tahoma:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">
                    <img src="images/vip-logo.jpg" alt="VIP Center" class="logo-img">
                </a>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="home.html" class="nav-link">الرئيسية</a>
                </li>
                <li class="nav-item">
                    <a href="teachers.html" class="nav-link">المدرسين</a>
                </li>
                <li class="nav-item">
                    <a href="video-access.html" class="nav-link">فتح الفيديو</a>
                </li>
                <li class="nav-item">
                    <a href="login.html" class="nav-link">تسجيل الدخول</a>
                </li>
                <li class="nav-item">
                    <a href="register.html" class="nav-link register-btn">سجل الآن</a>
                </li>
            </ul>
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="form-container">
        <div class="form-card">
            <div class="form-logo">
                <img src="images/vip-logo.jpg" alt="VIP Center">
            </div>
            
            <form id="registerForm" class="register-form">
                <div class="form-group">
                    <label for="fullName" class="form-label">الاسم الكامل</label>
                    <input type="text" id="fullName" name="fullName" class="form-input" placeholder="الاسم الكامل" required>
                </div>
                
                <div class="form-group">
                    <label for="email" class="form-label">البريد الإلكتروني</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="البريد الإلكتروني" required>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">كلمة المرور</label>
                    <div class="password-input-container">
                        <input type="password" id="password" name="password" class="form-input" placeholder="كلمة المرور" required>
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('password')">👁️</button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword" class="form-label">تأكيد كلمة المرور</label>
                    <div class="password-input-container">
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="تأكيد كلمة المرور" required>
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('confirmPassword')">👁️</button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="phone" class="form-label">رقم الهاتف</label>
                    <input type="tel" id="phone" name="phone" class="form-input" placeholder="رقم الهاتف" required>
                </div>
                
                <div class="form-group">
                    <label for="birthDate" class="form-label">تاريخ الميلاد</label>
                    <input type="date" id="birthDate" name="birthDate" class="form-input" required>
                </div>
                
                <div class="form-group">
                    <label for="gender" class="form-label">الجنس</label>
                    <select id="gender" name="gender" class="form-select" required>
                        <option value="">اختر الجنس</option>
                        <option value="male">ذكر</option>
                        <option value="female">أنثى</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="grade" class="form-label">السنة الدراسية</label>
                    <select id="grade" name="grade" class="form-select" required>
                        <option value="">اختر السنة الدراسية</option>
                        <option value="grade10">الصف الأول الثانوي</option>
                        <option value="grade11">الصف الثاني الثانوي</option>
                        <option value="grade12">الصف الثالث الثانوي</option>
                        <option value="other">أخرى</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="governorate" class="form-label">المحافظة</label>
                    <select id="governorate" name="governorate" class="form-select" required>
                        <option value="">اختر المحافظة</option>
                        <option value="cairo">القاهرة</option>
                        <option value="alexandria">الإسكندرية</option>
                        <option value="giza">الجيزة</option>
                        <option value="sharqia">الشرقية</option>
                        <option value="gharbia">الغربية</option>
                        <option value="menoufia">المنوفية</option>
                        <option value="qalyubia">القليوبية</option>
                        <option value="port_said">بورسعيد</option>
                        <option value="suez">السويس</option>
                        <option value="ismailia">الإسماعيلية</option>
                        <option value="damietta">دمياط</option>
                        <option value="beheira">البحيرة</option>
                        <option value="kafr_el_sheikh">كفر الشيخ</option>
                        <option value="other">أخرى</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="country" class="form-label">الدولة</label>
                    <select id="country" name="country" class="form-select" required>
                        <option value="">اختر الدولة</option>
                        <option value="egypt">🇪🇬 مصر</option>
                        <option value="saudi_arabia">🇸🇦 المملكة العربية السعودية</option>
                        <option value="uae">🇦🇪 الإمارات العربية المتحدة</option>
                        <option value="kuwait">🇰🇼 الكويت</option>
                        <option value="qatar">🇶🇦 قطر</option>
                        <option value="bahrain">🇧🇭 البحرين</option>
                        <option value="oman">🇴🇲 عمان</option>
                        <option value="jordan">🇯🇴 الأردن</option>
                        <option value="lebanon">🇱🇧 لبنان</option>
                        <option value="syria">🇸🇾 سوريا</option>
                        <option value="iraq">🇮🇶 العراق</option>
                        <option value="yemen">🇾🇪 اليمن</option>
                        <option value="palestine">🇵🇸 فلسطين</option>
                        <option value="other">أخرى</option>
                    </select>
                </div>
                
                <!-- Loading indicator -->
                <div id="registerLoading" style="display: none; text-align: center; color: #ff4d4d; margin: 1rem 0;">
                    <div style="font-size: 1.5rem;">🔄</div>
                    <p>جاري إنشاء الحساب...</p>
                </div>
                
                <!-- Error/Success message -->
                <div id="registerMessage" style="display: none; padding: 1rem; border-radius: 8px; margin: 1rem 0; text-align: center; border-right: 4px solid;"></div>
                
                <button type="submit" class="form-submit" id="registerButton">إنشاء الحساب</button>
                
                <div class="form-links">
                    <a href="login.html">لديك حساب بالفعل؟ سجل دخولك.</a>
                </div>
            </form>
        </div>
    </main>

    <script src="js/script.js"></script>
    <script src="js/supabase-config.js"></script>
    <script>
        // Real registration system
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Get form data
            const formData = new FormData(e.target);
            const userData = {
                full_name: formData.get('fullName'),
                email: formData.get('email'),
                password: formData.get('password'),
                confirm_password: formData.get('confirmPassword'),
                phone: formData.get('phone'),
                birth_date: formData.get('birthDate'),
                gender: formData.get('gender'),
                grade: formData.get('grade'),
                governorate: formData.get('governorate'),
                country: formData.get('country')
            };
            
            const registerButton = document.getElementById('registerButton');
            const registerLoading = document.getElementById('registerLoading');
            const registerMessage = document.getElementById('registerMessage');
            
            // Validation
            if (userData.password !== userData.confirm_password) {
                showMessage('كلمة المرور وتأكيدها غير متطابقين', 'error');
                return;
            }
            
            if (userData.password.length < 6) {
                showMessage('كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'error');
                return;
            }
            
            // Phone validation
            const phoneRegex = /^01[0-2,5]{1}[0-9]{8}$/;
            if (!phoneRegex.test(userData.phone)) {
                showMessage('رقم الهاتف غير صحيح. يجب أن يبدأ بـ 01 ويحتوي على 11 رقم', 'error');
                return;
            }
            
            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(userData.email)) {
                showMessage('البريد الإلكتروني غير صحيح', 'error');
                return;
            }
            
            // Show loading
            registerButton.disabled = true;
            registerLoading.style.display = 'block';
            registerMessage.style.display = 'none';
            
            try {
                // Check if Supabase functions are available
                if (!window.supabaseFunctions) {
                    throw new Error('خدمة قاعدة البيانات غير متاحة');
                }
                
                // Check if user already exists
                const { data: existingUser, error: checkError } = await window.supabaseClient
                    .from('students')
                    .select('email')
                    .eq('email', userData.email);
                
                if (existingUser && existingUser.length > 0) {
                    throw new Error('البريد الإلكتروني مستخدم بالفعل');
                }
                
                // Try to register with Supabase Auth first
                let authUser = null;
                try {
                    const { data: authData, error: authError } = await window.supabaseClient.auth.signUp({
                        email: userData.email,
                        password: userData.password,
                        options: {
                            data: {
                                full_name: userData.full_name,
                                phone: userData.phone
                            }
                        }
                    });
                    
                    if (!authError && authData.user) {
                        authUser = authData.user;
                    }
                } catch (authError) {
                    console.log('Auth registration failed, proceeding with custom registration');
                }
                
                // Add to students table
                const studentData = {
                    name: userData.full_name,
                    email: userData.email,
                    password: userData.password, // In production, hash this
                    phone: userData.phone,
                    birth_date: userData.birth_date,
                    gender: userData.gender,
                    grade: userData.grade,
                    governorate: userData.governorate,
                    country: userData.country,
                    status: 'active',
                    auth_user_id: authUser?.id || null
                };
                
                const result = await window.supabaseFunctions.addStudent(studentData);
                
                if (result.success) {
                    showMessage('تم إنشاء الحساب بنجاح! جاري التوجيه لتسجيل الدخول...', 'success');
                    
                    // Clear form
                    e.target.reset();
                    
                    // Redirect to login after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'login-simple.html';
                    }, 2000);
                } else {
                    throw new Error(result.error || 'فشل في إنشاء الحساب');
                }
                
            } catch (error) {
                console.error('Registration error:', error);
                showMessage(error.message || 'حدث خطأ في إنشاء الحساب', 'error');
            } finally {
                registerButton.disabled = false;
                registerLoading.style.display = 'none';
            }
        });
        
        // Show message function
        function showMessage(message, type) {
            const messageDiv = document.getElementById('registerMessage');
            messageDiv.textContent = message;
            
            if (type === 'error') {
                messageDiv.style.background = '#ffebee';
                messageDiv.style.color = '#c62828';
                messageDiv.style.borderRightColor = '#c62828';
            } else if (type === 'success') {
                messageDiv.style.background = '#e8f5e8';
                messageDiv.style.color = '#2e7d32';
                messageDiv.style.borderRightColor = '#2e7d32';
            }
            
            messageDiv.style.display = 'block';
        }
        
        // إظهار/إخفاء كلمة المرور
        function togglePasswordVisibility(fieldId) {
            const field = document.getElementById(fieldId);
            if (field.type === 'password') {
                field.type = 'text';
            } else {
                field.type = 'password';
            }
        }
    </script>
    <script src="js/auth-manager.js"></script>
</body>
</html>
