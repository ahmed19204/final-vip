<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>VIP Center - إدارة التخصصات</title>
	<link rel="stylesheet" href="css/admin-styles.css">
	<link href="https://fonts.googleapis.com/css2?family=Tahoma:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
	<div class="admin-container">
		<header class="admin-header">
			<div class="header-content">
				<div class="logo-section">
					<img src="images/vip-logo.jpg" alt="VIP Center" class="admin-logo">
					<h1>إدارة التخصصات</h1>
				</div>
				<div class="admin-header-actions">
					<button class="admin-btn admin-btn-primary" onclick="showAddSubjectModal()">➕ إضافة تخصص</button>
					<a href="admin-login.html" class="admin-logout-btn">تسجيل الخروج</a>
				</div>
			</div>
		</header>
		<main class="admin-main">
			<div class="admin-table-container">
				<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
					<h2 style="color:#fff;margin:0;">قائمة التخصصات</h2>
					<input type="text" class="admin-form-input" placeholder="بحث عن تخصص..." style="width:300px;" onkeyup="searchSubjects(this.value)">
				</div>
				<table class="admin-table" id="subjectsTable">
					<thead><tr><th>الاسم</th><th>الوصف</th><th>عدد الكورسات</th><th>الإجراءات</th></tr></thead>
					<tbody>
						<tr>
							<td>الفيزياء</td><td>علم الطبيعة والقوانين الأساسية</td><td>12</td>
							<td>
								<div class="admin-actions">
									<button class="admin-btn admin-btn-secondary admin-action-btn" onclick="editSubject(1)">تعديل</button>
									<a href="admin-courses.html" class="admin-btn admin-btn-primary admin-action-btn">كورسات</a>
									<button class="admin-btn admin-btn-danger admin-action-btn" onclick="deleteSubject(1)">حذف</button>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</main>
	</div>

	<div id="subjectModal" class="modal" style="display:none;">
		<div class="modal-content">
			<div class="modal-header">
				<h2 id="subjectModalTitle">إضافة تخصص</h2>
				<button class="modal-close" onclick="closeSubjectModal()">&times;</button>
			</div>
			<form id="subjectForm" class="admin-form-container">
				<div class="admin-form-group">
					<label class="admin-form-label">اسم التخصص *</label>
					<input type="text" id="subjectName" class="admin-form-input" required>
				</div>
				<div class="admin-form-group">
					<label class="admin-form-label">الوصف</label>
					<textarea id="subjectDescription" class="admin-form-textarea" placeholder="وصف مختصر"></textarea>
				</div>
				<div class="modal-footer">
					<button type="button" class="admin-btn admin-btn-secondary" onclick="closeSubjectModal()">إلغاء</button>
					<button type="submit" class="admin-btn admin-btn-primary">حفظ</button>
				</div>
			</form>
		</div>
	</div>

	<script src="js/admin-script.js"></script>
	<script src="js/admin-subjects.js"></script>
</body>
</html>
