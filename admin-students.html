<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>إدارة الطلاب - VIP Center</title>
	<link rel="stylesheet" href="styles.css">
	<link rel="stylesheet" href="admin-styles.css">
	<link href="https://fonts.googleapis.com/css2?family=Tahoma:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
	<div class="admin-dashboard">
		<aside class="admin-sidebar">
			<div class="admin-sidebar-header">
				<img src="vip-logo.jpg" alt="VIP Center">
				<h3>لوحة التحكم</h3>
				<div class="admin-role">مدير عام</div>
			</div>
			<nav class="admin-nav">
				<div class="admin-nav-item"><a href="admin-dashboard.html" class="admin-nav-link"><span class="admin-nav-icon">🏠</span><span>الرئيسية</span></a></div>
				<div class="admin-nav-item"><a href="admin-students.html" class="admin-nav-link active"><span class="admin-nav-icon">👥</span><span>إدارة الطلاب</span></a></div>
				<div class="admin-nav-item"><a href="admin-courses.html" class="admin-nav-link"><span class="admin-nav-icon">📚</span><span>إدارة الكورسات</span></a></div>
				<div class="admin-nav-item"><a href="admin-teachers.html" class="admin-nav-link"><span class="admin-nav-icon">👨‍🏫</span><span>إدارة المدرسين</span></a></div>
				<div class="admin-nav-item"><a href="admin-codes.html" class="admin-nav-link"><span class="admin-nav-icon">🔐</span><span>إدارة الأكواد</span></a></div>
				<div class="admin-nav-item"><a href="admin-settings.html" class="admin-nav-link"><span class="admin-nav-icon">⚙️</span><span>الإعدادات</span></a></div>
			</nav>
		</aside>
		<main class="admin-main">
			<header class="admin-header">
				<h1>إدارة الطلاب</h1>
				<div class="admin-header-actions">
					<button class="admin-btn admin-btn-primary" onclick="showAddStudentModal()">➕ إضافة طالب</button>
					<a href="admin-login.html" class="admin-logout-btn">تسجيل الخروج</a>
				</div>
			</header>
			<div class="admin-table-container">
				<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
					<h2 style="color:#fff;margin:0;">قائمة الطلاب</h2>
					<input type="text" class="admin-form-input" placeholder="بحث باسم الطالب أو البريد" style="width:300px;" onkeyup="searchStudents(this.value)">
				</div>
				<table class="admin-table" id="studentsTable">
					<thead>
						<tr>
							<th>الاسم</th><th>البريد</th><th>الهاتف</th><th>الكورسات</th><th>الحالة</th><th>الإجراءات</th>
						</tr>
					</thead>
					<tbody>
						<tr>
							<td>محمد أحمد</td><td>m.ahmed@example.com</td><td>01000000000</td><td>3</td><td><span class="admin-btn admin-btn-success admin-action-btn">نشط</span></td>
							<td>
								<div class="admin-actions">
									<button class="admin-btn admin-btn-secondary admin-action-btn" onclick="editStudent(1)">تعديل</button>
									<button class="admin-btn admin-btn-danger admin-action-btn" onclick="deleteStudent(1)">حذف</button>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</main>
	</div>

	<!-- Add/Edit Student Modal -->
	<div id="studentModal" class="modal" style="display:none;">
		<div class="modal-content">
			<div class="modal-header">
				<h2 id="studentModalTitle">إضافة طالب</h2>
				<button class="modal-close" onclick="closeStudentModal()">&times;</button>
			</div>
			<form id="studentForm" class="admin-form-container">
				<div class="admin-form-row">
					<div class="admin-form-group">
						<label class="admin-form-label">الاسم *</label>
						<input type="text" id="studentName" class="admin-form-input" required>
					</div>
					<div class="admin-form-group">
						<label class="admin-form-label">البريد *</label>
						<input type="email" id="studentEmail" class="admin-form-input" required>
					</div>
				</div>
				<div class="admin-form-row">
					<div class="admin-form-group">
						<label class="admin-form-label">الهاتف</label>
						<input type="tel" id="studentPhone" class="admin-form-input">
					</div>
					<div class="admin-form-group">
						<label class="admin-form-label">الحالة</label>
						<select id="studentStatus" class="admin-form-select">
							<option value="active">نشط</option>
							<option value="inactive">غير نشط</option>
						</select>
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" class="admin-btn admin-btn-secondary" onclick="closeStudentModal()">إلغاء</button>
					<button type="submit" class="admin-btn admin-btn-primary">حفظ</button>
				</div>
			</form>
		</div>
	</div>

	<script src="admin-script.js"></script>
	<script src="admin-students.js"></script>
</body>
</html>
